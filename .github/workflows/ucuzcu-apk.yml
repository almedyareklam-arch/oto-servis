name: Ucuzcu APK

on:
  push:
    branches: ["ucuzcu-apk"]
    paths:
      - "ucuzcu-android/**"
      - ".github/workflows/ucuzcu-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle
        run: |
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build debug APK
        working-directory: ucuzcu-android
        run: /tmp/gradle-8.10.2/bin/gradle --no-daemon assembleDebug

      - name: Copy APK
        run: cp ucuzcu-android/app/build/outputs/apk/debug/app-debug.apk Ucuzcu.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ucuzcu-APK
          path: Ucuzcu.apk
          if-no-files-found: error
